<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="./favicon.svg">
<title>발사탕 · 발행 심사</title>
<style>
:root{--bg:#F4F6F9;--panel:#FFFFFF;--panel2:#EEF1F5;--line:#DDE2EA;--ink:#161A22;--sub:#545D6E;--muted:#667085;
--pri:#2F6FED;--pri-d:#1F4FB5;--pri-soft:#E6EEFD;--good:#15803D;--good-soft:#E6F5EB;
--warn:#B45309;--warn-soft:#FDF3E1;--bad:#C62828;--bad-soft:#FDECEC;--r:8px;--r-lg:12px;--t:.16s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px;line-height:1.5;padding-bottom:120px;-webkit-font-smoothing:antialiased}
a{color:var(--pri-ink);text-decoration:none}
a:hover{text-decoration:underline}
/* 브라우저 기본 스타일이 입력칸 글자를 검게 칠한다. 어두운 배경이라 안 보였다 —
   라벨 붙여넣기 칸이 통째로 까만 글씨였다. 물려받게 해 둔다. */
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
/* 대표 책임 승인 칸 */
.ovr{margin:10px 0;padding:12px 14px;border:1px solid var(--warn);border-radius:var(--r);background:var(--warn-soft)}
.ovr.on{border-color:var(--good);background:var(--good-soft)}
.ovr h3{font-size:13px;margin-bottom:4px}
.ovrchk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:13px;cursor:pointer}
.ovrchk input{margin-top:3px}
.ovr [data-ovr-reason]{width:100%;margin:8px 0;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.ovr button{padding:8px 14px;border-radius:var(--r);border:none;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.ovr button.ghost{background:none;border:1px solid var(--line);color:var(--sub)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

.top{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.top h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
.top .meta{color:var(--sub);font-size:12px;margin-top:3px}
.wrap{max-width:860px;margin:0 auto;padding:16px}

.stat{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.stat div{flex:1;min-width:88px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.stat span{color:var(--sub);font-size:11px}

.batch{margin-bottom:26px}
.batch>h2{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:10px;letter-spacing:.02em}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.card.blocked{opacity:.72}
.hd{display:flex;align-items:flex-start;gap:10px;padding:14px;cursor:pointer;user-select:none}
.hd:hover{background:var(--panel2)}
.hd .t{flex:1;min-width:0}
.hd .t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.hd .t .sub{color:var(--sub);font-size:12px;margin-top:2px}
.chev{color:var(--muted);transition:transform var(--t);flex-shrink:0;margin-top:2px}
.card.open .chev{transform:rotate(90deg)}

.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.b{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;border:1px solid}
.b.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.b.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.b.wa{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

.body{display:none;border-top:1px solid var(--line);padding:14px}
.card.open .body{display:block}
.sec{margin-bottom:16px}
.sec:last-child{margin-bottom:0}
.sec>h3{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.04em;margin-bottom:7px;text-transform:uppercase}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:11px}
td.num{font-variant-numeric:tabular-nums}
tr.diff td{background:var(--bad-soft)}
tr.diff td:first-child{color:var(--bad);font-weight:600}

.srcbox{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.srcbox .role{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--pri-soft);color:var(--pri-ink);border:1px solid var(--pri)}
.srcbox .role.b{background:#FDF3E1;color:var(--warn);border-color:var(--warn)}
.srcbox .u{display:block;margin-top:6px;font-size:12px;word-break:break-all}
.srcbox .d{color:var(--muted);font-size:11px;margin-top:4px}
.quote{border-left:2px solid var(--line);padding-left:9px;margin-top:6px;color:var(--sub);font-size:12px}
.quote b{color:var(--ink);font-weight:600;display:block;font-size:11px;margin-bottom:2px}

.msg{font-size:12px;padding:7px 10px;border-radius:var(--r);margin-bottom:5px;border:1px solid}
.msg.f{background:var(--bad-soft);border-color:#F3C1C1;color:#B91C1C}
.msg.w{background:var(--warn-soft);border-color:#F2D49B;color:#92400E}

.act{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.act button{flex:1;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:transparent;
  color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--t);font-family:inherit}
.act button:hover:not(:disabled){border-color:var(--muted);color:var(--ink)}
.act button:disabled{opacity:.35;cursor:not-allowed}
.act button.sel-pub{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.act button.sel-rej{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .c{flex:1;font-size:12px;color:var(--sub)}
.bar .c b{color:var(--ink)}
.bar button{padding:11px 18px;border-radius:var(--r);border:none;background:var(--pri);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;transition:background var(--t);font-family:inherit}
.bar button:hover:not(:disabled){background:var(--pri-d)}
.bar button:disabled{opacity:.4;cursor:not-allowed}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty b{display:block;color:var(--sub);font-size:15px;margin-bottom:6px}
.note{background:var(--pri-soft);border:1px solid #E6EEFD;border-radius:var(--r);padding:11px 13px;
  font-size:12px;color:#1F57C8;margin-bottom:16px;line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity var(--t);pointer-events:none}
.toast.on{opacity:1}

/* 고치기 */
.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:11px;color:var(--sub);font-weight:600}
.f input,.f select{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);
  padding:8px 9px;font-size:13px;font-family:inherit;font-variant-numeric:tabular-nums;width:100%}
.f input:focus,.f select:focus{outline:none;border-color:var(--pri)}
.f.ch input,.f.ch select{border-color:var(--warn);background:var(--warn-soft)}
.f .was{font-size:10px;color:var(--warn);min-height:12px}
/* 라벨 붙여넣기 — 이 화면에서 제일 중요한 칸이라 눈에 띄게 둔다 */
.lab{margin-bottom:14px;padding:12px;border:1px solid var(--pri);background:var(--pri-soft);border-radius:var(--r)}
.lab.ok{border-color:var(--good);background:var(--good-soft)}
.lab textarea{width:100%;margin-top:8px;padding:9px 11px;border-radius:var(--r);resize:vertical;
  background:var(--panel2);border:1px solid var(--line);font-size:12.5px;line-height:1.6}
.lab textarea:focus{outline:none;border-color:var(--pri)}
.labact{display:flex;gap:6px;margin-top:8px}
.labact button{padding:8px 14px;border-radius:var(--r);border:1px solid var(--pri);
  background:var(--pri);color:#fff;font-weight:600;font-size:12.5px}
.labact button.ghost{background:transparent;border-color:var(--line);color:var(--sub);font-weight:500}
.labtab{width:100%;margin-top:10px;border-collapse:collapse;font-size:12px}
.labtab td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.labtab td:first-child{width:82px;color:var(--sub);white-space:nowrap}
/* 제품명 — 카드에서 제일 먼저 손대는 칸이라 맨 위에 눈에 띄게 둔다 */
.namebox{margin-bottom:14px;padding:12px 14px;border:1px solid var(--line);
  background:var(--panel2);border-radius:var(--r)}
.namebox.ch{border-color:var(--warn);background:var(--warn-soft)}
.namebox label{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:6px}
.namebox label .d{font-weight:500;color:var(--muted)}
.namebox input{width:100%;padding:9px 11px;border-radius:var(--r);background:var(--panel);
  border:1px solid var(--line);font-size:14px;font-weight:600}
.namebox input:focus{outline:none;border-color:var(--pri)}
.namebox .d{font-size:11px;color:var(--muted)}
.namebox b{color:var(--ink2)}
.thumbprev{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r)}
.thumbprev img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px}
.thumbprev .d{color:var(--muted);font-size:11px}
.calc{margin-top:9px;padding:9px;border:1px dashed var(--line);border-radius:var(--r)}
.calc .r{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.calc .r .f{flex:1;min-width:66px}
.calc button{padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:transparent;
  color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.calc button:hover{border-color:var(--muted);color:var(--ink)}
.calc .h{font-size:11px;color:var(--muted);margin-bottom:6px}
.derived{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.derived .p{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--line);color:var(--sub);font-variant-numeric:tabular-nums}
.derived .p.ch{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.derived .p.score{background:var(--pri-soft);border-color:var(--pri);color:#1F57C8}
.buy{margin-top:10px;padding:10px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r)}
.buy.ok{border-color:var(--good);background:var(--good-soft)}
.buy.bad{border-color:var(--bad);background:var(--bad-soft)}
.buy label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px}
.buy input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);padding:9px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.buy input:focus{outline:none;border-color:var(--pri)}
.buymsg{font-size:11px;margin-top:5px;color:var(--warn);line-height:1.5}
.buy.ok .buymsg{color:var(--good)}
.buy.bad .buymsg{color:var(--bad)}
.buysrc{display:inline-block;margin-top:6px;font-size:11.5px}
.reason{margin-top:9px}
.reason input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);padding:8px 9px;font-size:13px;font-family:inherit}
.reason input:focus{outline:none;border-color:var(--pri)}
.card.edited{border-color:var(--warn)}
.b.ed{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.bar .in .alt{background:transparent;border:1px solid var(--line);color:var(--sub)}
.bar .in .alt:hover:not(:disabled){background:var(--panel2);color:var(--ink)}
.top .alt{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;
  background:transparent;border:1px solid var(--line);color:var(--sub);cursor:pointer}
.top .alt:hover{background:var(--panel2);color:var(--ink)}
.bar .in .go{background:var(--good);color:#FFFFFF;font-weight:700}
.bar .in .go:hover:not(:disabled){filter:brightness(1.08)}
.bar .in .go:disabled{opacity:.4;cursor:not-allowed}

/* 어드민 안에 끼워 넣었을 때는 이 화면의 이동 링크를 감춘다.
   왼쪽에 이미 메뉴가 있어서 두 벌이 되면 헷갈린다. */
/* 어드민 껍데기(index.html) 안에 iframe 으로 뜰 때는 이 화면의 머리를 통째로 감춘다.
   제목·토큰 버튼·이동 링크가 껍데기에 이미 있어 두 벌로 보였다. 토큰은 같은 도메인
   같은 열쇠라 껍데기에서 한 번 넣으면 여기서도 그대로 쓴다. */
.embedded .top{display:none}
</style>
</head>
<body>

<script>if(window.top!==window.self)document.documentElement.classList.add('embedded');</script>

<div class="top">
  <h1>발행 심사</h1>
  <div class="meta" id="meta">불러오는 중…</div>
  <div style="flex:1"></div>
  <button id="tokenBtn" class="alt">토큰</button>
  <a href="foods.html" class="alt" style="display:inline-flex;align-items:center;text-decoration:none">사료 관리</a>
  <a href="index.html" class="alt" style="display:inline-flex;align-items:center;text-decoration:none">어드민</a>
</div>

<div class="wrap" id="wrap"></div>

<div class="bar" hidden id="bar">
  <div class="in">
    <div class="c" id="count"></div>
    <button id="clear" class="alt" hidden>수정 되돌리기</button>
    <button id="copy" disabled>명령만 복사</button>
    <button id="publish" class="go" disabled>GitHub 에 발행</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* 앱(balsatang.com)에 있는 것을 그대로 읽는다 — 채점 로직·원료 사전·문구 템플릿.
   여기에 옮겨 적으면 두 벌이 되어 반드시 어긋난다.
   GitHub Pages 가 CORS 를 열어 둬서 다른 도메인에서도 읽을 수 있다.
   로컬에서 볼 때는 localStorage 에 balsatang.appBase 를 넣어 딴 곳을 보게 할 수 있다. */
window.APP_BASE = (function () {
  try { var o = localStorage.getItem('balsatang.appBase'); if (o) return o; } catch (e) { }
  return /(^|\.)balsatang\.com$/.test(location.hostname) ? 'https://balsatang.com/' : '../app/';
})();
/* policy·gate1·label 도 앱 쪽 engine/ 에 있다. 게이트 검사와 라벨 판독을
   Node 스크립트와 똑같은 코드로 돌리기 위해서다 — 옮겨 적으면 어긋난다. */
document.write(['engine/dict.js', 'engine/phrases.js', 'engine/engine.js',
                'engine/policy.js', 'engine/gate1.js', 'engine/label.js']
  .map(function (f) { return '<scr' + 'ipt src="' + window.APP_BASE + f + '"><\/scr' + 'ipt>'; }).join(''));
</script>
<script src="github.js"></script>
<script src="publish.js"></script>
<script>
const RATING_LABEL={quality:'원료',carb:'탄수화물',additive:'첨가물',value:'가성비'};
/* evidence 키('ratings.quality','price.p')를 사람이 읽는 이름으로 */
const EV_LABEL={'price.p':'가격','price.wg':'중량','facts.protein':'조단백',
  'facts.dmCarb':'건물기준 탄수','facts.firstIngrCat':'1번 원료','facts.cautionN':'주의 성분',
  'facts.dangerN':'위험 성분'};
const FACT_LABEL={protein:'조단백(%)',dmCarb:'건물기준 탄수(%)',firstIngrCat:'1번 원료',
  cautionN:'주의 성분(개)',dangerN:'위험 성분(개)'};
const evLabel=k=>EV_LABEL[k]||RATING_LABEL[k.split('.')[1]]||k;
const ROLE_LABEL={official:'제조사 공식',importer:'수입사 공식',authority:'정부·기관',retail:'판매처',label:'제품 라벨',catalog:'카탈로그'};
const decision={};  // stagingId -> 'publish' | 'reject'
let DATA=null;

/* ── 루브릭 ──────────────────────────────────────────────
   engine.js 한 곳에서만 계산한다. 예전에는 이 파일이 같은 식을 따로 적어
   두고 있었는데, 그러면 한쪽만 고쳐졌을 때 화면과 발행 결과가 달라진다.
   지금은 심사 화면이 직접 발행까지 하므로 더더욱 한 벌이어야 한다. */
/* engine.js 가 전역에 같은 이름을 두므로 여기서 다시 선언하지 않는다.
   부르는 자리에서 ENGINE.* 를 그대로 쓴다. */
function scoreOf(r){
  if(!r||['quality','additive','carb','value'].some(k=>r[k]==null))return null;
  return ENGINE.computeScore(r);
}

/* stagingId -> {facts:{}, price:{}, reason:''} — 사람이 고친 값만 담는다 */
const edits={};
const LS_KEY='balsatang.review.edits.v1';
try{Object.assign(edits,JSON.parse(localStorage.getItem(LS_KEY)||'{}'));}catch{}
const saveEdits=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(edits));}catch{}};

const FIELD=[
  {k:'facts.protein',    label:'조단백 (%)',        type:'num',step:'0.1'},
  {k:'facts.dmCarb',     label:'건물기준 탄수 (%)',  type:'num',step:'0.1'},
  {k:'facts.firstIngrCat',label:'1번 원료',          type:'sel',
   opts:[['meat','육류'],['fish','어류'],['grain','곡물'],['veg','채소'],['other','기타']]},
  {k:'facts.cautionN',   label:'주의 성분 (개)',     type:'num',step:'1'},
  {k:'facts.dangerN',    label:'위험 성분 (개)',     type:'num',step:'1'},
  {k:'price.p',          label:'가격 (원)',          type:'num',step:'10'},
  {k:'price.wg',         label:'중량 (g)',           type:'num',step:'1'},
  /* 가격 기준 용량은 '판매 중인 용량 중 최소' 여야 한다(DATA-POLICY 3.4).
     확인한 용량을 다 적어야 게이트가 최소값인지 볼 수 있다. */
  {k:'price.wgOptions',  label:'판매 용량 (g, 쉼표)', type:'text',
   placeholder:'2000, 6000, 11400'},
  /* 열량은 라벨에만 있다. 급여량 계산이 이 값으로 돌아간다 — 없으면 상세 화면의
     '하루 몇 g' 이 안 나온다. 라벨에서 읽은 값을 보여 주고 고칠 수 있게 둔다. */
  {k:'meta.kcalPerKg',   label:'열량 (kcal/kg)',    type:'num',step:'1'},
  /* 썸네일. 다나와 사진이 엉뚱한 제품일 때가 있어 직접 넣을 수 있어야 한다. */
  {k:'meta.thumb',       label:'썸네일 이미지 주소',  type:'text', wide:true,
   placeholder:'https://… .jpg'},
  /* 성분 정보가 국내 표시사항인지, 해외 본사(글로벌) 정보인지. 해외면 프론트 상세에
     '※ ○○ 글로벌에서 제시되는 기본 정보로서…' 안내가 붙는다(DATA-POLICY 3.5). */
  {k:'meta.specOrigin',  label:'성분 정보 기준',     type:'sel',
   opts:[['domestic','국내 표시사항'],['overseas','해외 본사(글로벌) 정보']]},
  {k:'meta.specNote',    label:'해외 정보 안내문 (비우면 기본 문구)', type:'text', wide:true,
   placeholder:'※ ○○ 글로벌에서 제시되는 기본 정보로서, 국내 사료관리법에 따른 제품 표시사항과 일부 다를 수 있습니다.'},
  /* ── 쿠팡 주소는 두 개다. 쓰임이 달라서 한 칸에 넣으면 안 된다 ──
     가격 근거 : www.coupang.com/vp/products/1234…  상품 페이지. 어느 상품의
       얼마인지 확인할 수 있어야 근거가 된다. 게이트가 이 형식을 검사한다.
     구매 링크 : link.coupang.com/a/…  파트너스 단축링크. 사용자가 누르는 버튼이고
       이 링크로 들어온 구매에만 수수료가 붙는다. 주소만 봐서는 어느 상품인지
       알 수 없어 근거로는 쓸 수 없다. */
  {k:'price.srcUrl',     label:'가격 근거 · 쿠팡 상품 페이지', type:'text', wide:true,
   placeholder:'https://www.coupang.com/vp/products/6595020969'},
  {k:'price.buyUrl',     label:'구매 버튼 링크 · 쿠팡 파트너스', type:'text', wide:true,
   placeholder:'https://link.coupang.com/a/…'}
];

/* 구매 링크는 숫자가 아니라 따로 다룬다. 쿠팡 파트너스 링크로만 수수료가 붙으므로
   발행 전에 반드시 채워야 한다. 링크를 만드는 건 사람만 할 수 있다. */
const BUY_FIELD = 'price.buyUrl';

const dig=(o,path)=>path.split('.').reduce((v,k)=>v?.[k],o);

/* 원본값 + 수정값을 합친, 지금 화면이 주장하는 값 */
function effective(it){
  const e=edits[it.stagingId]||{};
  const p=it.proposed||{};
  return {
    facts:{...(p.facts||{}),...(e.facts||{})},
    price:{...(p.price||{}),...(e.price||{})}
  };
}
function isEdited(it){
  const e=edits[it.stagingId];
  if(!e)return false;
  return Object.keys(e.facts||{}).length>0||Object.keys(e.price||{}).length>0
       ||Object.keys(e.meta||{}).length>0||!!e.label||!!e.override;
}

/* ── 라벨을 채운 뒤의 항목 ──
   발행 직전에 publish.js 가 하는 일과 똑같아야 한다. 그래서 같은 함수를 부른다.
   여기서 따로 조립하면 화면이 '통과' 라고 해 놓고 발행이 막히거나, 그 반대가 된다. */
function merged(it){
  return PUB.applyEdits(it, edits[it.stagingId]);
}

/* 지금 값으로 게이트를 다시 돌린 결과. build-review 가 미리 계산해 둔 ready 는
   라벨을 채우기 전 상태라, 채운 뒤에는 여기서 다시 판정해야 한다.
   같은 checkItem 을 부르므로 검사가 느슨해지지 않는다.
   (중복 검사는 data.js 가 필요해 여기서는 못 한다 — 발행 직전 publish.js 가 한다.) */
function gateNow(it){
  if(!isEdited(it)){
    const fail=it.gates.g1fail||[];
    return {fail,warn:it.gates.g1warn||[],draft:!!it.draft,pending:!!it.pricePending,ready:!!it.ready,
            hard:fail.filter(f=>PUB.HARD.has(f.code)),soft:fail.filter(f=>!PUB.HARD.has(f.code))};
  }
  const m=merged(it);
  const pending=m.proposed.pricePending===true;
  if(m.proposed.draft)return {fail:[],warn:[],draft:true,pending,ready:false,
                              todo:GATE1.draftTodo(m)};
  let r;
  try{ r=GATE1.checkItem(m,[],new Set()); }
  catch(err){ return {fail:[{msg:'게이트 검사 중 오류: '+err.message}],warn:[],
                      draft:false,pending,ready:false}; }
  /* 이름과 라벨이 어긋나면 알린다. 막지는 않는다 — '프리런 덕' 처럼 이름이
     레시피명인 경우도 있어 사람이 판단해야 한다. 다만 조용히 넘기면
     '닭고기 사료' 라고 적힌 소고기 사료가 그대로 나간다. */
  const fc=LABEL.flavorCheck(m.proposed.name, m.proposed.ingredients||[]);
  const warn=[...r.warn];
  if(fc)warn.unshift({msg:`제품명은 '${fc.missing.join('·')}' 인데 라벨 앞 원료엔 없습니다 `+
    `(${fc.head.slice(0,3).join(', ')}). 다른 맛의 라벨을 붙여넣었는지, 제품명을 고쳐야 하는지 봐주세요`});
  /* 대표 책임 승인 — 승인으로 넘긴 탈락을 빼고 남은 게 없으면 발행할 수 있다.
     승인으로 못 넘기는 탈락(hard)은 값을 채워야 풀린다. publish.js 와 같은 규칙. */
  const left=PUB.afterOverride(r.fail,edits[it.stagingId]?.override);
  const hard=r.fail.filter(f=>PUB.HARD.has(f.code));
  const soft=r.fail.filter(f=>!PUB.HARD.has(f.code));
  return {...r,warn,draft:false,pending,ready:left.length===0,
          overridden:r.fail.length>0&&left.length===0,hard,soft};
}
/* 지금 화면이 주장하는 별점. 값을 합치고 점수를 매기는 일은 publish.js 가 이미
   하므로 그 결과를 그대로 읽는다. 여기서 또 계산하면 화면과 발행 결과가 갈린다 —
   실제로 가격을 넣어도 '가격 대기' 로 남고 가성비 별점이 안 나왔다. */
function derived(it){
  const p=merged(it).proposed;
  return {pKg:p.price?.pKg??null, ratings:p.ratings, score:p.score??null,
          pending:p.pricePending===true};
}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>n==null?'—':Number(n).toLocaleString('ko-KR')+'원';

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1900);}

/* 수집 AI 값과 심사 AI 값을 나란히 놓는다. 다른 줄은 빨갛게 표시한다. */
function auditTable(it){
  const ind=it.audit?.independent||{};
  /* 사람이 라벨 원본을 보고 넣은 건은 대조할 상대가 없다. 오른쪽 열이 전부 '—' 인 걸
     '아직 안 돌았다' 로 읽으면 안 되니, 왜 비었는지 표에 대고 말한다. */
  const byHuman=it.gates?.g2==='사람';
  const rows=[];
  /* 사실을 먼저 대조한다. 점수는 사실에서 계산되므로 사실이 맞으면 점수도 맞다. */
  for(const k of Object.keys(FACT_LABEL)){
    const a=it.proposed?.facts?.[k], b=ind.facts?.[k];
    if(a==null&&b==null)continue;
    rows.push([FACT_LABEL[k],a??'—',b??'—',b!=null&&a!==b]);
  }
  for(const k of ['quality','carb','additive','value']){
    const a=it.proposed?.ratings?.[k], b=ind.ratings?.[k];
    if(a==null&&b==null)continue;
    rows.push([RATING_LABEL[k]+' 점수',a??'—',b??'—',b!=null&&a!==b]);
  }
  rows.push(['가격',won(it.proposed?.price?.p),ind.price?.p!=null?won(ind.price.p):'—',
             ind.price?.p!=null&&ind.price.p!==it.proposed?.price?.p]);
  rows.push(['중량',(it.proposed?.price?.wg??'—')+'g',ind.price?.wg!=null?ind.price.wg+'g':'—',
             ind.price?.wg!=null&&ind.price.wg!==it.proposed?.price?.wg]);
  return `<table><thead><tr><th>항목</th><th>${byHuman?'사람이 라벨에서 읽은 값':'수집 AI'}</th>
      <th>${byHuman?'AI 재조사 — 면제':'심사 AI (독립 재조사)'}</th></tr></thead><tbody>${
    rows.map(([l,a,b,d])=>`<tr class="${d?'diff':''}"><td>${esc(l)}</td><td class="num">${esc(a)}</td><td class="num">${esc(b)}</td></tr>`).join('')
  }</tbody></table>${byHuman?`<p class="d" style="margin-top:8px">사람이 제품 라벨 원본을 보고 직접 넣은 값이라 AI 블라인드 재조사를 걸지 않습니다.
     대신 <b>출처 링크를 열어 라벨 사진과 아래 값이 같은지</b> 직접 확인하세요.</p>`:''}`;
}

function sourceBlock(it){
  return (it.sources||[]).map((s,i)=>{
    const quotes=Object.entries(it.evidence||{}).filter(([,e])=>e.src===i);
    return `<div class="srcbox">
      <span class="role ${s.role==='retail'?'b':''}">${esc(ROLE_LABEL[s.role]||s.role)}</span>
      <a class="u" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)} ↗</a>
      <div class="d">확인: ${esc((s.fetchedAt||'').slice(0,10))}${s.title?' · '+esc(s.title):''}</div>
      ${quotes.map(([k,e])=>`<div class="quote"><b>${esc(evLabel(k))}</b>${esc(e.quote)}</div>`).join('')}
    </div>`;
  }).join('') || '<div class="msg f">출처가 없습니다</div>';
}

/* ── 제품명 ──
   카탈로그 이름이 그대로 들어온다. '아카나 시니어' 처럼 라인 이름만 오는데,
   실제로는 닭·칠면조처럼 맛이 여럿이라 그 이름으로는 어느 봉지인지 알 수 없다.
   심사하면서 바로 고칠 수 있어야 해서 카드 맨 위에 둔다.

   이름은 '매대에서 그 봉지를 집을 수 있는 만큼'(DATA-POLICY 3.8) —
   라인 + 레시피(주재료) + 대상. 용량과 브랜드는 넣지 않는다. */
function nameBox(it){
  const cur=edits[it.stagingId]?.meta?.name;
  const orig=it.proposed?.name??'';
  const val=cur!==undefined?cur:orig;
  const changed=cur!==undefined&&cur!==orig;
  return `<div class="namebox${changed?' ch':''}">
    <label>제품명 <span class="d">— 브랜드 <b>${esc(it.proposed?.brand??'')}</b> 뒤에 붙습니다. 용량은 넣지 마세요</span></label>
    <input data-edit="meta.name" value="${esc(val)}" placeholder="예) 시니어 닭고기"
      autocapitalize="off" autocomplete="off" spellcheck="false">
    <div class="d" style="margin-top:5px">${changed
      ? `원래 <b>${esc(orig)}</b> → 발행되면 <b>${esc(it.proposed?.brand??'')} ${esc(val)}</b>`
      : `발행되면 <b>${esc(it.proposed?.brand??'')} ${esc(val)}</b> 로 올라갑니다`}</div>
  </div>`;
}

/* ── 라벨 붙여넣기 ──
   칸을 마흔 개 만드는 대신 라벨을 통째로 받는다. 원료 표기·보장성분·열량·
   썸네일·구매 링크를 한 번에 갈라낸다. 갈라낸 결과를 그대로 보여 주고,
   사람이 확인한 뒤에야 값에 반영된다 — 조용히 집어넣지 않는다. */
function labelBox(it){
  const L=edits[it.stagingId]?.label;
  const done=!!L;
  return `<div class="lab${done?' ok':''}">
    <h3 style="margin-top:0">라벨 붙여넣기</h3>
    <p class="d">제품 라벨의 <b>원재료명·보장성분·칼로리</b>를 통째로 복사해 넣으세요.
      썸네일 주소와 쿠팡 구매 링크도 같이 넣으면 함께 읽습니다. 형식은 신경 쓰지 않아도 됩니다.</p>
    <textarea data-label rows="5" placeholder="원재료명: 신선한 닭고기(21%), 닭고기 분말(20%), …&#10;조단백질(이상): 35 %&#10;조지방(이상): 11 %&#10;…&#10;3070 kcal/kg&#10;https://… (썸네일)&#10;https://link.coupang.com/a/… (구매)"></textarea>
    <div class="labact">
      <button data-act="readlabel">라벨 읽기</button>
      ${done?`<button data-act="droplabel" class="ghost">지우기</button>`:''}
      ${isEdited(it)?`<button data-act="resetedits" class="ghost">고친 값 모두 지우기</button>`:''}
    </div>
    <div class="labout">${done?labelSummary(L):''}</div>
  </div>`;
}

/* 무엇을 읽었는지 그대로 보여 준다. 못 읽은 건 못 읽었다고 적는다. */
function labelSummary(L){
  const g=L.ga||{};
  const miss=['protein','fat','fiber','moisture'].filter(k=>g[k]==null);
  const K={protein:'조단백',fat:'조지방',fiber:'조섬유',moisture:'수분',ash:'조회분'};
  const rows=[
    ['원료', L.ingredients.length ? `${L.ingredients.length}종 · 1번 ${L.ingredients[0]}` : '못 읽음'],
    ['보장성분', Object.entries(K).filter(([k])=>g[k]!=null).map(([k,l])=>`${l} ${g[k]}`).join(' · ')||'못 읽음'],
    ['열량', L.kcalPerKg?`${L.kcalPerKg.toLocaleString('ko-KR')} kcal/kg`:'못 읽음'],
    ['안전성', L.ingredients.length?`양호 ${L.dist.safe} · 주의 ${L.dist.caution} · 위험 ${L.dist.danger}${L.unknown.length?` · 모름 ${L.unknown.length}`:''}`:'—'],
    ['썸네일', L.thumb?'읽음':'못 읽음'],
    ['구매 링크', L.buyUrl?'읽음':'못 읽음']
  ];
  return `<table class="labtab"><tbody>${rows.map(([k,v])=>
      `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
    ${miss.length?`<div class="msg f" style="margin-top:8px">✗ ${miss.map(k=>K[k]).join('·')}을(를) 못 읽었습니다 —
       건물기준 탄수를 계산할 수 없어요. 아래 칸에 직접 넣어주세요.</div>`:''}
    ${L.unknown.length?`<div class="msg w" style="margin-top:8px">⚠ 사전에 없는 원료 ${L.unknown.length}개:
       ${esc(L.unknown.join(', '))}<br>주의·위험 성분 수에 안 들어갑니다. 오타면 고쳐서 다시 읽어주세요.</div>`:''}
    ${L.ingredients.length?`<details style="margin-top:8px"><summary class="d">읽은 원료 ${L.ingredients.length}종 보기</summary>
       <div class="d" style="margin-top:6px;line-height:1.8">${L.ingr.map(x=>
         `<span class="p ${x.safe==='caution'||x.safe==='danger'?'ch':''}">${esc(x.name)}</span>`).join(' ')}</div></details>`:''}`;
}

/* ── 두 쿠팡 주소를 헷갈리지 않게 ──
   심사자가 파트너스 단축링크를 '가격 근거' 칸에 넣었다. 형식만 보고 게이트가
   막긴 하는데, 왜 막히는지 그 자리에서 알려주는 게 낫다. */
function urlHint(it){
  const m=merged(it).proposed;
  const src=m.price?.srcUrl??edits[it.stagingId]?.price?.srcUrl??'';
  const buy=m.price?.buyUrl??'';
  const isProduct=/^https?:\/\/([\w-]+\.)*coupang\.com\/vp\/products\/\d+/i.test(src);
  const isShort=/link\.coupang\.com\/a\//i.test(src);
  const buyOk=/^https?:\/\/([\w-]+\.)*coupang\.com\//i.test(buy);
  const rows=[];
  if(src&&isShort)rows.push(['f',
    '가격 근거 칸에 <b>파트너스 단축링크</b>가 들어 있습니다. 이 주소만으로는 어느 상품의 얼마인지 확인할 수 없어 근거가 못 됩니다. '+
    '링크를 브라우저에서 열면 <code>www.coupang.com/vp/products/…</code> 로 바뀌는데, 그 주소를 넣어주세요. 지금 주소는 아래 <b>구매 버튼 링크</b> 칸이 맞는 자리입니다.']);
  else if(src&&!isProduct)rows.push(['f','가격 근거는 쿠팡 상품 페이지(<code>/vp/products/…</code>)여야 합니다.']);
  else if(src)rows.push(['ok','가격 근거 · 쿠팡 상품 페이지 확인']);
  if(buy&&!buyOk)rows.push(['f','구매 버튼 링크가 쿠팡 도메인이 아닙니다.']);
  else if(!buy)rows.push(['w','구매 버튼 링크가 없습니다 — 이 링크로 들어온 구매에만 수수료가 붙습니다.']);
  const thumb=m.thumb;
  return `${rows.map(([k,t])=>`<div class="msg ${k==='ok'?'':k}"${k==='ok'?' style="border-color:#B7E1C4;background:var(--good-soft);color:#166534"':''}>${t}</div>`).join('')}
    ${thumb?`<div class="thumbprev"><img src="${esc(thumb)}" alt=""
        onerror="this.closest('.thumbprev').innerHTML='<span class=d>썸네일 주소를 열지 못했습니다 — 주소를 확인해 주세요</span>'">
      <span class="d">썸네일 미리보기</span></div>`:''}`;
}

/* 값을 고치는 칸. 원본과 달라지면 노란 테두리와 '원래 N' 표시가 붙는다. */
function editBlock(it){
  const id=it.stagingId, e=edits[id]||{};
  const fields=FIELD.map(f=>{
    const [grp,key]=f.k.split('.');
    /* meta.* 는 proposed 바로 아래 값이다 (meta.name → proposed.name) */
    const orig=grp==='meta'?dig(it.proposed,key):dig(it.proposed,f.k);
    const cur=e[grp]?.[key];
    const val=cur!==undefined?cur:orig;
    const changed=cur!==undefined&&cur!==orig;
    /* 가격 칸을 잠가 뒀었다. 그래서 '가격 대기' 항목은 심사 화면에서 가격을 넣을
       방법이 아예 없었다 — 영영 가격 대기로 남는다는 뜻이다. 열어 두고,
       넣은 값이 규칙에 맞는지는 게이트가 판단하게 한다. */
    const show=val==null?'':Array.isArray(val)?val.join(', '):val;
    const input=f.type==='sel'
      ? `<select data-edit="${esc(f.k)}">${f.opts.map(([v,l])=>
          `<option value="${v}"${v===val?' selected':''}>${l}</option>`).join('')}</select>`
      : f.type==='text'
        ? `<input type="text" data-edit="${esc(f.k)}" value="${esc(show)}"
             placeholder="${esc(f.placeholder||'')}" autocapitalize="off" autocomplete="off" spellcheck="false">`
        : `<input type="number" step="${f.step}" inputmode="decimal" data-edit="${esc(f.k)}"
             value="${esc(show)}">`;
    return `<div class="f${changed?' ch':''}"${f.wide?' style="grid-column:1/-1"':''}>
      <label>${esc(f.label)}</label>${input}
      <div class="was">${changed?'원래 '+esc(orig==null?'—':Array.isArray(orig)?orig.join(', '):orig):''}</div>
    </div>`;
  }).join('');

  const d=derived(it), o=it.proposed||{};
  const pill=(label,now,before,cls='')=>
    `<span class="p ${cls} ${now!==before?'ch':''}">${esc(label)} ${esc(now??'—')}${
      now!==before?` <s style="opacity:.6">${esc(before??'—')}</s>`:''}</span>`;

  return `<div class="sec">${labelBox(it)}<h3>고치기</h3>
    <div class="edit">${fields}</div>
    ${urlHint(it)}
    ${(() => {
      /* 조단백은 위 '고치기' 에 이미 칸이 있다. 여기 또 두면 같은 값을 두 번 묻는 꼴이라
         어느 쪽이 진짜인지 알 수 없다. 위 칸을 그대로 읽어 쓰고, 나머지 셋만 받는다.

         값은 '라벨을 반영한 뒤' 의 ga 로 채운다. 예전엔 원본(다나와) ga 를 읽어서,
         라벨에서 조지방·조섬유·수분을 다 읽어 놓고도 칸이 비어 있었다.
         그래서 못 읽은 것처럼 보였다 — 실제로는 읽어서 탄수까지 계산한 상태였다. */
      const g = merged(it).proposed?.ga || {};
      const cell = (k, l) => `<div class="f"><label>${l}</label>
        <input type="number" step="0.1" data-calc="${k}" value="${g[k] == null ? '' : esc(g[k])}"></div>`;
      return `<div class="calc">
      <div class="h">조지방·조섬유·수분을 바꾸면 건물기준 탄수를 다시 계산합니다.
        조단백은 위 칸을 그대로 씁니다. 조회분은 빼지 않습니다.</div>
      <div class="r">
        ${cell('fat', '조지방')}${cell('fiber', '조섬유')}${cell('moisture', '수분')}
        <button data-act="calc">탄수 다시 계산</button>
      </div>
    </div>`;
    })()}
    <div class="derived">
      ${pill('원료',d.ratings.quality,o.ratings?.quality)}
      ${pill('탄수',d.ratings.carb,o.ratings?.carb)}
      ${pill('첨가물',d.ratings.additive,o.ratings?.additive)}
      ${pill('가성비',d.ratings.value,o.ratings?.value)}
      ${pill('kg당',d.pKg!=null?d.pKg.toLocaleString('ko-KR')+'원':'—',
             o.price?.pKg!=null?o.price.pKg.toLocaleString('ko-KR')+'원':'—')}
      ${pill('총점',d.score,o.score,'score')}
    </div>
    <div class="reason">
      <input data-reason placeholder="왜 고쳤는지 — 근거가 된 문장이나 링크 (발행 명령에 함께 실립니다)"
        value="${esc(e.reason||'')}">
    </div>
    ${isEdited(it)?`<div class="msg w" style="margin-top:9px">⚠ 고친 값은 발행 명령에 함께 실립니다.
      게이트는 원본이 아니라 고친 값으로 다시 돌아갑니다.</div>`:''}
  </div>`;
}

function pubLabel(G,ed){
  if(G.ready)return G.overridden?'책임 승인으로 발행':(ed?'고쳐서 발행':'발행');
  return G.draft?'자료 수집 중':'게이트 미통과';
}

/* ── 대표 책임 승인 ──
   게이트가 막은 이유를 하나씩 확인(체크)하고 이유를 적으면 발행할 수 있게 한다.
   무엇을 넘겼는지와 이유는 발행 데이터(src.override)에 남는다. */
function overrideBox(it,G){
  if(G.draft||!G.fail?.length)return '';
  const ov=edits[it.stagingId]?.override;
  if(G.hard?.length)return `<div class="ovr"><h3>승인으로 넘길 수 없는 항목</h3>
    <p class="d">값이 비어 있거나 형식이 깨져 화면에 그릴 수 없어요. 아래 <b>고치기</b>에서 채우면 풀립니다.</p>
    ${G.hard.map(f=>`<div class="d">· ${esc(f.msg)}</div>`).join('')}</div>`;
  if(G.overridden)return `<div class="ovr on"><h3>✓ 대표 책임 승인됨</h3>
    <p class="d">이유: ${esc(ov.reason)}</p>
    <button data-ovr-cancel class="ghost">승인 취소</button></div>`;
  return `<div class="ovr"><h3>대표 확인 후 승인</h3>
    <p class="d">게이트가 막은 이유를 하나씩 직접 확인하고 체크하세요. 모두 체크하고 이유를 적으면 발행할 수 있어요.</p>
    ${G.soft.map((f,i)=>`<label class="ovrchk"><input type="checkbox" data-ovr-i="${i}"> <span>${esc(f.msg)}</span></label>`).join('')}
    <input data-ovr-reason placeholder="승인 이유 — 예) 국내 판매 제품 봉투로 직접 확인함" autocomplete="off">
    <button data-ovr-ok>확인하고 승인</button></div>`;
}

function card(it){
  const g=it.gates;
  /* 라벨을 채웠으면 그 값으로 다시 돌린 게이트가 진짜다. 여기서 it.draft 를 그대로
     읽으면 다 채워 놓고도 '자료 수집 중' 이 그대로 붙어 있다. */
  const G=gateNow(it);
  const badges=[
    /* 자료 수집 중은 '탈락' 이 아니다. 아직 라벨을 못 본 것뿐이라 다르게 적는다. */
    G.draft
      ? `<span class="b wa b-g1">자료 수집 중</span>`
      : G.pending
        ? `<span class="b wa b-g1">가격 대기</span>`
        : `<span class="b b-g1 ${G.ready?'ok':'no'}">게이트1 ${G.ready?'통과':'탈락'}</span>`,
    /* 사람이 라벨을 보고 직접 넣은 건은 AI 블라인드 대조를 면제한다. 통과처럼
       보이게 하지 않고 '사람 입력' 이라고 그대로 적는다 — 심사자가 알아야 한다. */
    /* 자료 수집 중이면 대조할 값 자체가 없다. '불일치' 라고 적으면 틀렸다는 뜻이 된다. */
    it.draft ? ''
      : g.g2==='사람'
        ? `<span class="b wa">사람 입력 · 라벨 판독</span>`
        : `<span class="b ${g.g2==='match'?'ok':'no'}">게이트2 ${g.g2==='match'?'일치':'불일치'}</span>`,
    g.g3warn.length?`<span class="b wa">게이트3 경고 ${g.g3warn.length}</span>`:`<span class="b ok">게이트3 정상</span>`,
    isEdited(it)?`<span class="b ed">수정됨</span>`:''
  ].join('');
  const p=it.proposed||{};
  return `<div class="card ${it.ready?'':'blocked'} ${isEdited(it)?'edited':''}" data-id="${esc(it.stagingId)}">
    <div class="hd">
      <span class="chev">▸</span>
      <div class="t">
        <b>${esc(it.label)}</b>
        <div class="sub">${esc(p.type||'')} · ${it.pricePending?'가격 미확보':`${won(p.price?.p)} / ${p.price?.wg??'—'}g`} · ${p.score??'—'}점</div>
        <div class="badges">${badges}</div>
      </div>
    </div>
    <div class="body">
      ${nameBox(it)}
      <div class="gatemsg">
      ${G.draft?`<div class="msg w"><b>자료 수집 중</b> — 카탈로그에서 기본 정보만 가져온 상태예요.
         아래 <b>라벨 붙여넣기</b>에 라벨을 넣으면 채점이 돌아갑니다.<br>${
           (G.todo||g.todo||[]).map(t=>'· '+esc(t)).join('<br>')}</div>`
        : G.pending?`<div class="msg w">⏸ 가격을 아직 못 구했습니다 — 아래 <b>가격·중량·판매 용량·쿠팡 상품 페이지</b>를 채우면 가성비 별점과 총점이 나옵니다</div>`:''}
      ${G.fail.map(f=>`<div class="msg f">✗ ${esc(f.msg)}</div>`).join('')}
      ${G.warn.map(w=>`<div class="msg w">⚠ ${esc(w.msg)}</div>`).join('')}
      </div>
      <div class="ovrbox">${overrideBox(it,G)}</div>
      ${g.g3warn.map(w=>`<div class="msg w">⚠ ${esc(w)}</div>`).join('')}
      ${G.draft?'':`<div class="sec"><h3>대조</h3>${auditTable(it)}</div>`}
      <div class="sec"><h3>출처와 근거</h3>${sourceBlock(it)}</div>
      ${editBlock(it)}
    </div>
    <div class="act">
      <button data-act="reject">반려</button>
      <button data-act="publish"${G.ready?'':' disabled'}>${pubLabel(G,isEdited(it))}</button>
    </div>
  </div>`;
}

function render(){
  const wrap=document.getElementById('wrap');
  const s=DATA.summary;
  document.getElementById('meta').textContent =
    `${DATA.builtAt.slice(0,16).replace('T',' ')} 기준${DATA.live?' · URL 실접속 검사 포함':''}`;

  if(!s.total){
    wrap.innerHTML=`<div class="empty"><b>발행 대기 중인 사료가 없습니다</b>수집 루틴이 돌면 여기에 나타납니다.</div>`;
    return;
  }
  wrap.innerHTML=`
    <div class="note">
      출처 링크를 직접 열어 값이 맞는지 확인한 뒤 판단하세요.
      값이 틀렸으면 카드 안 <b>고치기</b>에서 바로 바꿀 수 있습니다 — 별점과 총점은 루브릭으로 다시 계산됩니다.
      결정을 마치면 아래 <b>GitHub 에 발행</b>을 누릅니다 — 그 자리에서 data.js 에 병합해 커밋하고,
      몇 분 뒤 사이트에 반영됩니다. 게이트에 막힌 건은 카드 안 <b>대표 확인 후 승인</b>에서 이유를 하나씩 확인하고 승인하면 발행할 수 있습니다.
      (<b>명령만 복사</b>는 예전 방식으로, 터미널에서 처리할 때만 씁니다.)
    </div>
    <div class="stat">
      <div><b>${s.total}</b><span>전체</span></div>
      <div><b style="color:var(--good)">${s.ready}</b><span>발행 후보</span></div>
      <div><b style="color:var(--bad)">${s.blocked}</b><span>보류${s.pricePending?` (가격 ${s.pricePending})`:''}</span></div>
    </div>
    ${DATA.batches.map(b=>`<div class="batch">
      <h2>${esc(b.file)}${b.collectedAt?' · 수집 '+esc(b.collectedAt.slice(0,10)):''}</h2>
      ${b.items.map(card).join('')}
    </div>`).join('')}`;
  document.getElementById('bar').hidden=false;
  updateBar();
}

function updateBar(){
  const pub=Object.values(decision).filter(v=>v==='publish').length;
  const rej=Object.values(decision).filter(v=>v==='reject').length;
  const ed=Object.keys(edits).filter(id=>isEdited(itemById(id))).length;
  document.getElementById('count').innerHTML=
    `발행 <b>${pub}</b> · 반려 <b>${rej}</b>${ed?` · 수정 <b>${ed}</b>`:''}`;
  document.getElementById('copy').disabled=!(pub+rej+ed);
  document.getElementById('publish').disabled=!(pub+rej);
  document.getElementById('clear').hidden=!ed;
}

const itemById=id=>DATA?.batches.flatMap(b=>b.items).find(i=>i.stagingId===id);

/* 카드를 통째로 다시 그리면 지금 입력 중인 칸이 사라진다.
   그래서 값을 고쳤을 때는 바뀌는 부분만 손댄다. */
function patchCard(id){
  const el=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  const it=itemById(id);
  if(!el||!it)return;
  const ed=isEdited(it);

  el.classList.toggle('edited',ed);
  const badges=el.querySelector('.badges');
  const mark=badges.querySelector('.b.ed');
  if(ed&&!mark)badges.insertAdjacentHTML('beforeend','<span class="b ed">수정됨</span>');
  if(!ed&&mark)mark.remove();

  for(const input of el.querySelectorAll('[data-edit]')){
    /* 제품명 칸은 '고치기' 격자 밖(카드 맨 위)에 있어 .f 래퍼가 없다.
       예전엔 여기서 null 을 건드려 patchCard 가 통째로 멈췄고, 이름을 고쳐도
       카드 제목이 그대로였다. 래퍼가 있는 칸만 표시를 갱신한다. */
    const f=input.closest('.f');
    if(!f)continue;
    const [grp,key]=input.dataset.edit.split('.');
    const cur=edits[id]?.[grp]?.[key];
    const orig=grp==='meta'?dig(it.proposed,key):dig(it.proposed,input.dataset.edit);
    const changed=cur!==undefined&&cur!==orig;
    f.classList.toggle('ch',changed);
    f.querySelector('.was').textContent=changed?'원래 '+(orig??'—'):'';
  }

  /* 제품명 칸의 안내와 노란 테두리 */
  const nb=el.querySelector('.namebox');
  if(nb){
    const cur=edits[id]?.meta?.name;
    const orig=it.proposed?.name??'', brand=it.proposed?.brand??'';
    const val=cur!==undefined?cur:orig;
    const changed=cur!==undefined&&cur!==orig;
    nb.classList.toggle('ch',changed);
    nb.querySelector(':scope > .d').innerHTML=changed
      ? `원래 <b>${esc(orig)}</b> → 발행되면 <b>${esc(brand)} ${esc(val)}</b>`
      : `발행되면 <b>${esc(brand)} ${esc(val)}</b> 로 올라갑니다`;
  }

  const d=derived(it), o=it.proposed||{};
  const pill=(label,now,before,cls='')=>
    `<span class="p ${cls} ${now!==before?'ch':''}">${esc(label)} ${esc(now??'—')}${
      now!==before?` <s style="opacity:.6">${esc(before??'—')}</s>`:''}</span>`;
  el.querySelector('.derived').innerHTML=[
    pill('원료',d.ratings.quality,o.ratings?.quality),
    pill('탄수',d.ratings.carb,o.ratings?.carb),
    pill('첨가물',d.ratings.additive,o.ratings?.additive),
    pill('가성비',d.ratings.value,o.ratings?.value),
    pill('kg당',d.pKg!=null?d.pKg.toLocaleString('ko-KR')+'원':'—',
         o.price?.pKg!=null?o.price.pKg.toLocaleString('ko-KR')+'원':'—'),
    pill('총점',d.score,o.score,'score')
  ].join('');

  /* 라벨을 채웠으면 게이트를 그 값으로 다시 돌린 결과가 진짜다.
     안 그러면 다 채워 놓고도 '게이트 미통과' 로 막혀 발행이 안 된다 — 실제로 그랬다. */
  const g=gateNow(it);
  const pub=el.querySelector('.act button[data-act="publish"]');
  pub.disabled=!g.ready;
  pub.textContent=pubLabel(g,ed);
  if(!g.ready&&decision[id]==='publish'){delete decision[id];pub.classList.remove('sel-pub');updateBar();}
  const ob=el.querySelector('.ovrbox');
  /* 승인 칸에 이유를 쓰는 중이면 다시 그리지 않는다 — 쓰던 글이 날아간다 */
  if(ob&&!ob.contains(document.activeElement))ob.innerHTML=overrideBox(it,g);

  /* 무엇이 막고 있는지 카드 위쪽 줄에 그대로 보여 준다 */
  const box=el.querySelector('.gatemsg');
  if(box){
    box.innerHTML=[
      g.draft?`<div class="msg w"><b>자료 수집 중</b> — 아래 <b>라벨 붙여넣기</b>에 라벨을 넣으면 채점이 돌아갑니다.<br>${
        (g.todo||it.gates.todo||[]).map(t=>'· '+esc(t)).join('<br>')}</div>`:'',
      !g.draft&&g.pending?`<div class="msg w">⏸ 가격을 아직 못 구했습니다 — 아래 <b>가격·중량·판매 용량·쿠팡 상품 페이지</b>를 채우면 가성비 별점과 총점이 나옵니다</div>`:'',
      ...g.fail.map(f=>`<div class="msg f">✗ ${esc(f.msg)}</div>`),
      ...g.warn.map(w=>`<div class="msg w">⚠ ${esc(w.msg)}</div>`)
    ].join('');
  }

  /* 이름을 고쳤으면 카드 제목도 바뀌어야 한다. 안 그러면 접었을 때 옛 이름이
     보여서 무엇을 발행하는지 헷갈린다. */
  const mp=merged(it).proposed;
  el.querySelector('.t b').textContent=`${mp.brand} ${mp.name}`;

  const b1=el.querySelector('.b-g1');
  if(b1){
    b1.className='b b-g1 '+(g.draft||g.pending?'wa':g.ready?'ok':'no');
    b1.textContent=g.draft?'자료 수집 중':g.pending?'가격 대기':
      g.ready?'게이트1 통과':'게이트1 탈락';
  }
}

/* 값이 원본과 같아지면 수정 기록에서 지운다 — 안 고친 것으로 되돌아간다 */
function setEdit(id,path,raw){
  const it=itemById(id); if(!it)return;
  const [grp,key]=path.split('.');
  const orig=grp==='meta'?dig(it.proposed,key):dig(it.proposed,path);
  let val=raw;
  const isText = path==='facts.firstIngrCat' || path===BUY_FIELD
              || path==='price.srcUrl' || path==='meta.name' || path==='meta.thumb'
              || path==='meta.specOrigin' || path==='meta.specNote';
  if(path==='price.wgOptions'){
    /* '2000, 6000, 11400' → [2000,6000,11400]. 게이트가 최소 용량인지 볼 때 쓴다. */
    const list=String(raw).split(/[,\s]+/).map(s=>Number(s)).filter(n=>n>0);
    val=list.length?[...new Set(list)].sort((a,b)=>a-b):null;
    const e0=edits[id]||(edits[id]={}); const g0=e0.price||(e0.price={});
    if(val==null)delete g0.wgOptions; else g0.wgOptions=val;
    if(!Object.keys(g0).length)delete e0.price;
    if(!Object.keys(e0).length&&!e0.reason)delete edits[id];
    saveEdits();patchCard(id);updateBar();
    return;
  }
  if(!isText){
    val=String(raw).trim()===''?null:Number(raw);
    if(val!=null&&Number.isNaN(val))return;
  }
  if(val==='')val=null;
  const e=edits[id]||(edits[id]={});
  const g=e[grp]||(e[grp]={});
  if(val===orig||(val==null&&orig==null)||(val==null&&orig===undefined))delete g[key]; else g[key]=val;
  if(!Object.keys(g).length)delete e[grp];
  if(!Object.keys(e).length&&!e.reason)delete edits[id];
  saveEdits();
  patchCard(id);
  updateBar();
}

document.addEventListener('change',e=>{
  const f=e.target.closest('[data-edit]');
  if(f){
    const id=f.closest('.card').dataset.id, k=f.dataset.edit.replace(/^facts\./,'');
    /* 사람이 손댄 칸은 이제 '라벨이 넣은 칸' 이 아니다 — 라벨을 다시 읽어도 지우지 않는다 */
    const E=edits[id]; if(E?.labelFacts)E.labelFacts=E.labelFacts.filter(x=>x!==k);
    setEdit(id,f.dataset.edit,f.value);return;
  }
  const r=e.target.closest('[data-reason]');
  if(r){
    const id=r.closest('.card').dataset.id;
    const v=r.value.trim();
    if(v)(edits[id]||(edits[id]={})).reason=v;
    else if(edits[id]){delete edits[id].reason; if(!Object.keys(edits[id]).length)delete edits[id];}
    saveEdits();updateBar();
  }
});

/* ── 라벨 읽기 ──
   갈라낸 값을 edits 에 넣는다. 사람이 이미 손으로 고쳐 둔 칸은 덮지 않는다 —
   라벨보다 사람이 직접 넣은 값이 우선이다. */
function readLabel(card){
  const id=card.dataset.id, it=itemById(id);
  const text=card.querySelector('[data-label]').value;
  if(!text.trim()){toast('라벨 내용을 붙여넣어 주세요');return;}

  const r=LABEL.parse(text);
  if(!r.ingredients.length&&r.ga.protein==null){
    toast('원료 표기도 보장성분도 못 찾았어요 — 라벨 내용이 맞는지 봐주세요');return;
  }
  const e=edits[id]||(edits[id]={});
  e.label={
    ingredients:r.ingredients, ga:r.ga, kcalPerKg:r.kcalPerKg,
    ingr:r.ingr, dist:r.dist, unknown:r.unknown,
    thumb:r.thumb, buyUrl:r.buyUrl,
    /* 근거 출처로 쓸 주소. 라벨을 판독한 화면(상품 페이지)을 가리킨다. */
    srcUrl:r.productUrl||it.sources?.[0]?.url||'',
    at:new Date().toISOString(), text
  };
  const f=e.facts||(e.facts={});
  /* 지난번 라벨 읽기가 넣은 칸은 사람이 고친 칸이 아니다. 지우고 새 라벨 값으로 다시 채운다.
     안 지우면 옛 라벨 값(예: 다른 나라 라벨의 조단백 28)이 '사람이 고친 값' 으로 남아
     새 라벨과 어긋났다는 탈락이 계속 뜬다. */
  for(const k of e.labelFacts||[])delete f[k];
  const wrote=[];
  for(const [k,v] of Object.entries(r.facts)){
    if(f[k]!==undefined)continue;                 /* 사람이 이미 고친 칸은 둔다 */
    if(v==null)continue;
    if(v!==dig(it.proposed,'facts.'+k)){f[k]=v;wrote.push(k);}
  }
  e.labelFacts=wrote;
  /* 라벨에서 읽은 값을 고치기 칸에도 넣는다. 안 넣으면 읽어 놓고도 칸이 비어 있어
     '못 읽었다' 로 보인다 — 실제로 그렇게 보였다. 사람이 이미 고친 칸은 안 건드린다. */
  const meta=e.meta||(e.meta={});
  if(r.kcalPerKg!=null&&meta.kcalPerKg===undefined&&r.kcalPerKg!==it.proposed?.kcalPerKg)
    meta.kcalPerKg=r.kcalPerKg;
  if(r.thumb&&meta.thumb===undefined&&r.thumb!==it.proposed?.thumb)meta.thumb=r.thumb;
  if(!Object.keys(meta).length)delete e.meta;
  const pr=e.price||(e.price={});
  if(r.buyUrl&&pr.buyUrl===undefined)pr.buyUrl=r.buyUrl;
  if(r.productUrl&&pr.srcUrl===undefined)pr.srcUrl=r.productUrl;
  if(r.wgOptions.length&&pr.wgOptions===undefined)pr.wgOptions=r.wgOptions;
  if(r.price&&pr.p===undefined){pr.p=r.price.p;pr.wg=r.price.wg;}
  if(!Object.keys(pr).length)delete e.price;
  saveEdits();
  render();
  toast(`읽었습니다 — 원료 ${r.ingredients.length}종${r.unknown.length?` (모르는 원료 ${r.unknown.length}개)`:''}`);
}

document.addEventListener('click',e=>{
  const rl=e.target.closest('[data-act="readlabel"]');
  if(rl){readLabel(rl.closest('.card'));return;}
  /* 이 사료에 대해 이 브라우저에 남은 고친 값(라벨·성분·가격·이름)을 전부 지운다.
     같은 사료를 다시 수집하면 예전 고친 값이 새 자료와 어긋난 채 남을 수 있어서다. */
  const rs=e.target.closest('[data-act="resetedits"]');
  if(rs){
    const id=rs.closest('.card').dataset.id;
    if(!confirm('이 사료에 넣었던 라벨·고친 값을 모두 지울까요? (저장소 자료는 그대로입니다)'))return;
    delete edits[id];saveEdits();render();toast('고친 값을 모두 지웠습니다');return;
  }
  const dl=e.target.closest('[data-act="droplabel"]');
  if(dl){
    const id=dl.closest('.card').dataset.id;
    if(edits[id]){
      /* 라벨이 넣은 칸도 같이 지운다. 사람이 손으로 고친 칸은 남긴다. */
      const E=edits[id];
      for(const k of E.labelFacts||[])if(E.facts)delete E.facts[k];
      if(E.facts&&!Object.keys(E.facts).length)delete E.facts;
      delete E.label; delete E.labelFacts;
      if(!Object.keys(E).length)delete edits[id];
    }
    saveEdits();render();toast('라벨 판독을 지웠습니다');
    return;
  }

  const calc=e.target.closest('[data-act="calc"]');
  if(calc){
    const card=calc.closest('.card');
    const g=k=>card.querySelector(`[data-calc="${k}"]`).value;
    /* 조단백은 위 '고치기' 칸이 진짜다. 여기서 또 받지 않는다. */
    const protein=card.querySelector('[data-edit="facts.protein"]')?.value;
    const dm=ENGINE.computeDmCarb({protein,fat:g('fat'),fiber:g('fiber'),moisture:g('moisture')});
    if(dm==null){toast('조단백·조지방·조섬유·수분이 모두 있어야 계산됩니다');return;}
    card.querySelector('[data-edit="facts.dmCarb"]').value=dm;
    setEdit(card.dataset.id,'facts.dmCarb',dm);
    toast(`건물기준 탄수 ${dm}% 로 채웠습니다`);
    return;
  }

  const ovOk=e.target.closest('[data-ovr-ok]');
  if(ovOk){
    const cardEl=ovOk.closest('.card'), id=cardEl.dataset.id, it=itemById(id);
    const box=ovOk.closest('.ovr');
    const all=[...box.querySelectorAll('[data-ovr-i]')];
    if(all.some(c=>!c.checked)){toast('막힌 이유를 모두 확인하고 체크해 주세요');return;}
    const reason=box.querySelector('[data-ovr-reason]').value.trim();
    if(reason.length<4){toast('승인 이유를 적어 주세요');return;}
    const G=gateNow(it);
    (edits[id]||(edits[id]={})).override={msgs:G.soft.map(f=>f.msg),reason,at:new Date().toISOString()};
    saveEdits();
    decision[id]='publish';
    render();
    document.querySelector(`.card[data-id="${CSS.escape(id)}"]`)?.classList.add('open');
    toast('책임 승인했어요 — 아래 GitHub 에 발행을 누르면 올라갑니다');
    return;
  }
  const ovNo=e.target.closest('[data-ovr-cancel]');
  if(ovNo){
    const id=ovNo.closest('.card').dataset.id;
    if(edits[id]){delete edits[id].override; if(!Object.keys(edits[id]).length)delete edits[id];}
    delete decision[id];
    saveEdits();render();
    document.querySelector(`.card[data-id="${CSS.escape(id)}"]`)?.classList.add('open');
    return;
  }

  const hd=e.target.closest('.hd');
  if(hd){hd.closest('.card').classList.toggle('open');return;}

  const btn=e.target.closest('.act button');
  if(btn&&!btn.disabled){
    const card=btn.closest('.card'), id=card.dataset.id, act=btn.dataset.act;
    decision[id]=decision[id]===act?undefined:act;
    if(!decision[id])delete decision[id];
    card.querySelectorAll('.act button').forEach(b=>{
      b.classList.toggle('sel-pub',decision[id]==='publish'&&b.dataset.act==='publish');
      b.classList.toggle('sel-rej',decision[id]==='reject'&&b.dataset.act==='reject');
    });
    updateBar();
  }
});

/* 발행 명령. 고친 값이 있으면 edits 블록을 함께 싣는다.
   scripts/apply-edits.mjs 가 이 JSON 을 그대로 받아 스테이징에 반영하고 게이트를 다시 돌린다. */
function buildCommand(){
  const pub=Object.entries(decision).filter(([,v])=>v==='publish').map(([k])=>k);
  const rej=Object.entries(decision).filter(([,v])=>v==='reject').map(([k])=>k);
  const lines=['/publish'];
  if(pub.length)lines.push('approve: '+pub.join(' '));
  if(rej.length)lines.push('reject: '+rej.join(' '));
  const touched=Object.keys(edits).filter(id=>isEdited(itemById(id))||edits[id].reason);
  if(touched.length){
    const out={};
    for(const id of touched)out[id]=edits[id];
    lines.push('edits:','```json',JSON.stringify(out,null,2),'```');
  }
  return lines.join('\n');
}

async function copyText(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg);}
  catch{prompt('아래를 복사해 붙여넣으세요',text);}
}

document.getElementById('copy').addEventListener('click',
  ()=>copyText(buildCommand(),'복사됨 — PR 코멘트에 붙여넣으세요'));

document.getElementById('clear').addEventListener('click',()=>{
  if(!Object.keys(edits).length)return;
  if(!confirm('고친 값을 모두 되돌릴까요?'))return;
  for(const k of Object.keys(edits))delete edits[k];
  saveEdits();render();toast('수정 내용을 되돌렸습니다');
});

/* 배포본은 review.json 을 쓴다. GitHub Pages 가 밑줄로 시작하는 파일을 빼기 때문이다.
   로컬에서 build-review 만 돌린 경우를 위해 _review.json 도 뒤이어 시도한다. */
/* 토큰이 있으면 저장소에서 곧바로 읽는다. 배포를 기다리지 않아도 되고,
   방금 발행한 결과가 바로 반영된다. 없으면 배포본을 읽는다(읽기 전용). */
async function loadReview(){
  if(GH.token){
    try{
      const f=await GH.getFile('data/staging/review.json');
      return JSON.parse(f.text);
    }catch(e){ console.warn('저장소에서 읽지 못해 배포본으로 넘어갑니다', e); }
  }
  /* 예전엔 어드민이 앱과 같은 저장소 안(…/balsatang/admin/)에 있어서 ../../ 로 닿았다.
     지금은 admin.balsatang.com 이라 그 경로가 루트 위로 올라가 버린다 — 404 가 났다.
     데이터는 앱 도메인에 있으므로 APP_BASE 를 거쳐 읽는다. */
  const base = window.APP_BASE || '../../';
  let last;
  for(const p of [base+'data/staging/review.json', base+'data/staging/_review.json']){
    try{
      const r=await fetch(p,{cache:'no-store'});
      if(r.ok) return r.json();
      last=new Error('HTTP '+r.status);
    }catch(e){ last=e; }
  }
  throw last ?? new Error('불러오기 실패');
}

/* ── 토큰 ── */
document.getElementById('tokenBtn').addEventListener('click',async()=>{
  const v=prompt(
    'fine-grained personal access token 을 넣어주세요.\n'+
    '· Repository access: butblank-oss/gsso_scat 하나만\n'+
    '· Permissions: Contents = Read and write\n'+
    '· Expiration: 되도록 짧게\n\n'+
    '이 브라우저에만 저장되고 저장소에는 들어가지 않아요. 비우면 삭제돼요.',
    GH.token?'••••••••':'');
  if(v===null||v==='••••••••')return;
  GH.token=v.trim();
  location.reload();
});

/* ── 발행 ──
   승인한 건을 그 자리에서 data.js 에 병합해 커밋한다.
   이 버튼이 있기 전에는 명령문을 복사해 누군가 터미널에서 실행해야 했다. */
document.getElementById('publish').addEventListener('click',async()=>{
  if(!GH.token){ toast('먼저 토큰을 넣어주세요'); return; }
  const pub=Object.values(decision).filter(v=>v==='publish').length;
  const rej=Object.values(decision).filter(v=>v==='reject').length;
  if(!pub&&!rej){ toast('발행하거나 반려할 항목을 골라주세요'); return; }

  const names=Object.entries(decision).map(([id,v])=>{
    const it=itemById(id); if(!it)return null;
    return `${v==='publish'?'발행':'반려'} · ${it.proposed?.brand} ${it.proposed?.name}`;
  }).filter(Boolean);
  if(!confirm(`아래 내용을 main 에 커밋합니다.\n\n${names.join('\n')}`))return;

  const btn=document.getElementById('publish');
  btn.disabled=true;
  try{
    const who=await GH.check();
    if(!who.canWrite)throw new Error('이 토큰에는 쓰기 권한이 없습니다');
    const r=await PUB.run({decision,edits,review:DATA,onStep:s=>{btn.textContent=s+'…';}});

    /* 발행한 건은 결정·수정 기록에서 지운다. 안 그러면 다음에 또 올라간다. */
    for(const id of [...r.published.map(f=>f.src?.stagingId),...r.rejected.map(x=>x.stagingId)]){
      delete decision[id]; delete edits[id];
    }
    saveEdits();
    DATA=r.review;
    render();

    const extra=r.refused.length?` (게이트 미통과 ${r.refused.length}건은 남겨뒀어요)`:'';
    toast(`커밋했어요 — ${r.commit.sha.slice(0,7)}. 몇 분 뒤 사이트에 반영돼요${extra}`);
  }catch(e){
    toast(e.message);
    console.error(e);
  }finally{
    btn.disabled=false; btn.textContent='GitHub 에 발행';
    updateBar();
  }
});

loadReview()
  .then(d=>{DATA=d;render();})
  .catch(err=>{
    document.getElementById('meta').textContent='불러오기 실패';
    document.getElementById('wrap').innerHTML=
      `<div class="empty"><b>심사 데이터를 불러오지 못했습니다</b>
       ${esc(window.APP_BASE || '')}data/staging/review.json 을 읽지 못했어요.<br><br>
       토큰을 넣으면 저장소에서 곧바로 읽습니다 — 배포를 기다리지 않아도 돼요.<br>
       <span style="color:var(--muted);font-size:12px">(${esc(err.message)})</span></div>`;
  });
</script>
